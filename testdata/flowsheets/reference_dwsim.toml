# M4's reference flowsheet on DWSIM 9's constants and kij, to compare with
# DWSIM (testdata/m4_dwsim.json). Generated by tools/gen_m4_dwsim.py: don't edit.
format = 1

[components]
names = ["methane", "ethane", "propane", "n-butane", "n-pentane"]
data = ["../m4_dwsim/components"]

[model]
equation = "PR"
kij = false
kij_overrides = [{ a = "methane", b = "ethane", k = -0.0033 }, { a = "methane", b = "propane", k = 0.0119 }, { a = "methane", b = "n-butane", k = 0.0244 }, { a = "methane", b = "n-pentane", k = 0.023 }, { a = "ethane", b = "propane", k = 0.0011 }, { a = "ethane", b = "n-butane", k = 0.0089 }, { a = "ethane", b = "n-pentane", k = 0.0078 }, { a = "propane", b = "n-butane", k = 0.0033 }, { a = "propane", b = "n-pentane", k = 0.0267 }, { a = "n-butane", b = "n-pentane", k = 0.0174 }]

[solver]
method = "wegstein"

[feed.feed]
T = "300 K"
P = "30 bar"
flow = "100 mol/s"
mole_fractions = { methane = 0.7, ethane = 0.1, propane = 0.08, n-butane = 0.07, n-pentane = 0.05 }

[unit.mixer]
type = "mixer"
in = ["feed", "recycle"]
out = "mixed"

[unit.cooler]
type = "heater"
in = "mixed"
out = "cold"
outlet_T = "230 K"

[unit.drum]
type = "flash_drum"
in = "cold"
vapour = "gas"
liquid = "liquid"
duty = "0 W"

[unit.split]
type = "splitter"
in = "liquid"
out = ["back", "on"]
fractions = [0.5, 0.5]

[unit.pump]
type = "pump"
in = "back"
out = "recycle"
outlet_P = "31 bar"
efficiency = 0.75

[unit.valve]
type = "valve"
in = "on"
out = "let down"
outlet_P = "5 bar"

[unit.second]
type = "flash_drum"
in = "let down"
vapour = "flash gas"
liquid = "product"
duty = "0 W"
