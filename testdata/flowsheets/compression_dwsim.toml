# Two-stage compression on DWSIM 9's constants and kij (M8 step 13): a
# lean gas from 1 to 16 bar in two compressors, each 75% efficient, cooled
# back to 300 K between them. Its least work is near sqrt(1 x 16) = 4 bar,
# the ideal gas's. The same problem as M8 step 0's spike posed to DWSIM's
# optimiser (docs/spike-dwsim-study.md); tools/gen_m8_dwsim.py has DWSIM's
# answers, in testdata/m8_dwsim.json.
#
#     reflux optimize testdata/flowsheets/compression_dwsim.toml least_work
format = 3

[components]
names = ["methane", "ethane", "propane"]
data = ["../m4_dwsim/components"]

[model]
equation = "PR"
kij = false
kij_overrides = [{ a = "methane", b = "ethane", k = -0.0033 }, { a = "methane", b = "propane", k = 0.0119 }, { a = "ethane", b = "propane", k = 0.0011 }]

[feed.gas]
T = "300 K"
P = "1 bar"
flow = "10 mol/s"
mole_fractions = { methane = 0.9, ethane = 0.07, propane = 0.03 }

[unit.c1]
type = "compressor"
in = "gas"
out = "hot"
outlet_P = "8 bar"
efficiency = 0.75

[unit.cooler]
type = "heater"
in = "hot"
out = "cooled"
outlet_T = "300 K"

[unit.c2]
type = "compressor"
in = "cooled"
out = "out"
outlet_P = "16 bar"
efficiency = 0.75

# The least work, inside the bounds.
[optimize.least_work]
vary = [{ key = "unit.c1.outlet_P", between = ["1.5 bar", "12 bar"] }]
minimize = "c1.work + c2.work"

# The same, with the bounds above the optimum: it sits on the lower one.
[optimize.on_a_bound]
vary = [{ key = "unit.c1.outlet_P", between = ["6 bar", "12 bar"] }]
minimize = "c1.work + c2.work"
