# Tutorial 2's methanol reactor (M9 step 10) with a study (M8 step 6): the
# feed's T over four values, CO's conversion at each, and methanol's
# "conversion", (in - out)/in, which DWSIM plotted as -inf: the feed has no
# methanol, so it has no value, with its reason, at every point.
format = 3

[components]
names = ["carbon monoxide", "hydrogen", "methanol"]

[model]
equation = "PR"

[feed.syngas]
T = "320 degC"
P = "30 bar"
flow = "1500 kg/h"
mole_fractions = { "carbon monoxide" = 0.2, hydrogen = 0.8 }

[unit.reactor]
type = "conversion_reactor"
in = "syngas"
out = "product"
conversions = [{ reaction = "synthesis", key = "carbon monoxide", conversion = "0.85 - 0.0018*(T in degC)" }]

[reaction.synthesis]
equation = "CO + 2 H2 = CH3OH"

[study.temperature]
vary = [{ key = "feed.syngas.T", values = ["200 degC", "240 degC", "280 degC", "320 degC"] }]
report = { CO_conversion = "(syngas.n[CO] - product.n[CO]) / syngas.n[CO]", methanol_conversion = "(syngas.n[methanol] - product.n[methanol]) / syngas.n[methanol]", T_out = "(product.T in degC)" }
