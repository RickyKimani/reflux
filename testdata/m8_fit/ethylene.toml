# Ethylene's hydrogenation on a nickel site, LHHW, and ethane's
# hydrogenolysis, a power law, with their constants to fit to the rates in
# ethylene.csv (M8 step 11). The constants here are where the fit starts;
# tools/gen_m8_fits.py drew the data from others, and SciPy's fit of them
# is in testdata/m8_fits.json.
#
#     reflux fit testdata/m8_fit/ethylene.toml
format = 3

[components]
names = ["ethylene", "hydrogen", "ethane", "methane"]

[site.Ni]
terms = [
    { name = "K_E", K = { A = "3e-4 bar^-1", dH = "-45000 J/mol" }, a = { ethylene = 1 } },
    { name = "K_H", K = "0.3 bar^-1", a = { hydrogen = 1 } },
]

[reaction.hydrogenation]
equation = "C2H4 + H2 = C2H6"
law = "lhhw"
k = { A = "3e5 mol/(kg*s*bar^2)", Ea = "55000 J/mol" }
orders = { C2H4 = 1, H2 = 1 }
K = "none"
site = "Ni"
site_power = 2

[reaction.hydrogenolysis]
equation = "C2H6 + H2 = 2 CH4"
law = "power_law"
k = { A = "1e4 mol/(kg*s*bar^1.5)", Ea = "75000 J/mol" }
orders = { C2H6 = 1, H2 = 0.5 }
K = "none"

[fit.rates]
data = "ethylene.csv"
parameters = ["k1.A", "k1.Ea", "K_E.A", "K_E.dH", "K_H", "k2.A", "k2.Ea"]
weights = { "r[hydrogenation]" = "5 %", "r[hydrogenolysis]" = "5 %" }
