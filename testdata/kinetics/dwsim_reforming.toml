# The rates of the owner's DWSIM reforming case, as DWSIM has them typed
# (spike/dwsim_pfr/run.py, M9 step 0): Xu and Froment's constants rounded,
# R typed as 8.314, partial pressures in atm, rates in kmol/(kg·h), each
# reaction's own denominator (a DWSIM rate can name only its own species),
# and equilibrium constants typed in, the overall reaction's not the product
# of the other two.
format = 2

[components]
names = ["methane", "water", "hydrogen", "carbon monoxide", "carbon dioxide"]

[site.Ni]
symbol = "DEN"
terms = [
  { name = "K_CO", K = "8.23e-5 atm^-1 * exp(70650 J/mol / (8.314 J/(mol*K) * T))", a = { CO = 1 } },
  { name = "K_CH4", K = "6.65e-4 atm^-1 * exp(38280 J/mol / (8.314 J/(mol*K) * T))", a = { CH4 = 1 } },
  { name = "K_H2O", K = "1.77e5 * exp(-88680 J/mol / (8.314 J/(mol*K) * T))", a = { H2O = 1, H2 = -1 } },
  { name = "K_H2", K = "6.12e-9 atm^-1 * exp(82900 J/mol / (8.314 J/(mol*K) * T))", a = { H2 = 1 } },
]

[reaction.reforming]
equation = "CH4 + H2O = CO + 3 H2"
law = "lhhw"
k = "4.22e15 kmol*atm^0.5/(kg*h) * exp(-240100 J/mol / (8.314 J/(mol*K) * T))"
orders = { CH4 = 1, H2O = 1, H2 = -2.5 }
K = "exp(30.42 - 27106 K / T) * 1 atm^2"
driving = "difference"
site = "Ni"
site_power = 2

# DWSIM's shift has no CH4 term.
[reaction.shift]
equation = "CO + H2O = CO2 + H2"
law = "lhhw"
k = "1.96e6 kmol/(kg*h*atm) * exp(-67130 J/mol / (8.314 J/(mol*K) * T))"
orders = { CO = 1, H2O = 1, H2 = -1 }
K = "exp(-3.798 + 4160 K / T)"
driving = "difference"
site = "Ni"
site_power = 2
terms = [
  { name = "K_H2O", K = "1.77e5 * exp(-88680 J/mol / (8.314 J/(mol*K) * T))", a = { H2O = 1, H2 = -1 } },
  { name = "K_H2", K = "6.12e-9 atm^-1 * exp(82900 J/mol / (8.314 J/(mol*K) * T))", a = { H2 = 1 } },
  { name = "K_CO", K = "8.23e-5 atm^-1 * exp(70650 J/mol / (8.314 J/(mol*K) * T))", a = { CO = 1 } },
]

# DWSIM's overall reaction has no CO term.
[reaction.overall]
equation = "CH4 + 2 H2O = CO2 + 4 H2"
law = "lhhw"
k = "1.02e15 kmol*atm^0.5/(kg*h) * exp(-243900 J/mol / (8.314 J/(mol*K) * T))"
orders = { CH4 = 1, H2O = 2, H2 = -3.5 }
K = "exp(34.218 - 31266 K / T) * 1 atm^2"
driving = "difference"
site = "Ni"
site_power = 2
terms = [
  { name = "K_CH4", K = "6.65e-4 atm^-1 * exp(38280 J/mol / (8.314 J/(mol*K) * T))", a = { CH4 = 1 } },
  { name = "K_H2O", K = "1.77e5 * exp(-88680 J/mol / (8.314 J/(mol*K) * T))", a = { H2O = 1, H2 = -1 } },
  { name = "K_H2", K = "6.12e-9 atm^-1 * exp(82900 J/mol / (8.314 J/(mol*K) * T))", a = { H2 = 1 } },
]
