# chemsep1.xml (ChemSep v8.49, record 5). Real files will be generated by
# the importer. The schema is described in docs/data-format.md.

format = 1
name = "n-butane"
# Every value below comes from this source unless it says otherwise.
source = "ChemSep v8.49 (data/vendor/chemsep/chemsep1.xml)"

[ids]
